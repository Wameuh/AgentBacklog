[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbacklog"
version = "0.4.0"
description = "Shared FIFO queue of features between a user and dev agents"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
agentbacklog = "agentbacklog:main"
AgentBacklog = "agentbacklog:main"

[tool.setuptools]
py-modules = ["agentbacklog"]
